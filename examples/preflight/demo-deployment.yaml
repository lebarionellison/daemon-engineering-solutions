apiVersion: apps/v1
kind: Deployment
metadata:
  name: daemon-ace-preflight-demo
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: daemon-ace-preflight-demo
  template:
    metadata:
      labels:
        app: daemon-ace-preflight-demo
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
