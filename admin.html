<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DAEMON · Private Inquiry Dashboard</title>
<style>
:root{color-scheme:dark;--bg:#070a12;--panel:#0e1929;--line:#26374d;--text:#f4f7fc;--muted:#a6b5c9;--cyan:#63e8e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif}.wrap{width:min(1100px,92%);margin:40px auto}.brand{font-size:12px;letter-spacing:2px;color:var(--cyan);font-weight:900}.panel{margin-top:20px;padding:24px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}h1{font-size:30px;margin:7px 0}p,.muted{color:var(--muted)}label{display:block;margin:14px 0 6px;font-size:12px;font-weight:800}input,select{width:100%;padding:12px;border:1px solid #344b65;border-radius:8px;background:#07111e;color:#fff;font:inherit}button{border:0;border-radius:8px;padding:11px 16px;background:var(--cyan);color:#07111d;font-weight:900;cursor:pointer}button.secondary{background:#ffffff12;color:#e7eff8;border:1px solid #ffffff25}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.status{color:var(--cyan);font-size:12px;min-height:20px}.hidden{display:none!important}.lead{border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:12px;background:#091321}.lead h3{margin:0 0 6px;font-size:16px}.meta{font-size:11px;color:var(--muted)}.detail{white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0;color:#d8e4f2;font-size:13px}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.controls select{width:auto;min-width:145px;padding:8px}.empty{text-align:center;padding:32px;color:var(--muted)}@media(min-width:700px){#loginPanel{max-width:470px}}
</style></head><body><main class="wrap"><div class="brand">DAEMON ENGINEERING SOLUTIONS · PRIVATE</div><section id="loginPanel" class="panel"><h1>Inquiry dashboard</h1><p>Sign in to view prospective customer requests.</p><form id="loginForm"><label for="password">Dashboard password</label><input id="password" type="password" autocomplete="current-password" required><p class="status" id="loginStatus" role="status"></p><button type="submit">Sign in securely</button></form></section>
<section id="appPanel" class="panel hidden"><div class="row"><div><h1>Prospective customers</h1><p class="muted">Private lead inbox · newest requests first · up to 250 records</p></div><button class="secondary" id="logout">Sign out</button></div><div class="row"><p id="summary" class="muted">Loading inquiries…</p><button class="secondary" id="refresh">Refresh</button></div><p id="appStatus" class="status" role="status"></p><div id="leads"></div></section></main>
<script>
const loginPanel=document.getElementById("loginPanel"),appPanel=document.getElementById("appPanel"),loginStatus=document.getElementById("loginStatus"),appStatus=document.getElementById("appStatus"),leadsBox=document.getElementById("leads");
async function api(path,options={}){const r=await fetch(path,{credentials:"same-origin",...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||"Request failed ("+r.status+").");return data}
function showApp(){loginPanel.classList.add("hidden");appPanel.classList.remove("hidden");loadLeads()}
function showLogin(){appPanel.classList.add("hidden");loginPanel.classList.remove("hidden")}
async function checkSession(){try{const s=await api("/api/admin/session");if(s.authenticated)showApp();else showLogin()}catch{showLogin()}}
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();loginStatus.textContent="Signing in…";try{await api("/api/admin/login",{method:"POST",body:JSON.stringify({password:document.getElementById("password").value})});document.getElementById("password").value="";loginStatus.textContent="";showApp()}catch(err){loginStatus.textContent=err.message}});
async function loadLeads(){appStatus.textContent="Loading…";try{const data=await api("/api/admin/leads");const leads=data.leads||[];document.getElementById("summary").textContent=leads.length+" inquiry record(s)";if(!leads.length){leadsBox.innerHTML='<div class="empty">No inquiries yet. New website submissions will appear here.</div>';appStatus.textContent="";return}leadsBox.innerHTML=leads.map(x=>'<article class="lead"><div class="row"><div><h3>'+esc(x.name)+' · '+esc(x.company)+'</h3><div class="meta">'+esc(x.email)+' · '+esc(x.request_type)+' · '+esc(x.created_at)+'</div></div><div class="controls"><select aria-label="Lead status" data-id="'+Number(x.id)+'">'+["new","contacted","qualified","closed"].map(v=>'<option value="'+v+'" '+(v===x.status?"selected":"")+'>'+v.toUpperCase()+'</option>').join("")+'</select><button class="secondary" data-save="'+Number(x.id)+'">Save status</button></div></div><div class="detail">'+esc(x.pain)+'</div></article>').join("");appStatus.textContent="";leadsBox.querySelectorAll("[data-save]").forEach(b=>b.addEventListener("click",async()=>{const id=Number(b.dataset.save),select=leadsBox.querySelector('select[data-id="'+id+'"]');b.disabled=true;try{await api("/api/admin/leads/status",{method:"PATCH",body:JSON.stringify({id,status:select.value})});appStatus.textContent="Lead status updated."}catch(err){appStatus.textContent=err.message}finally{b.disabled=false}}))}catch(err){appStatus.textContent=err.message;if(err.message==="Unauthorized.")showLogin()}}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
document.getElementById("refresh").addEventListener("click",loadLeads);document.getElementById("logout").addEventListener("click",async()=>{try{await api("/api/admin/logout",{method:"POST",body:"{}"})}finally{showLogin()}});checkSession();
</script></body></html>
