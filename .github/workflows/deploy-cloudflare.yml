name: Deploy Daemon Engineering Solutions to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: daemon-engineering-solutions-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare static site
        run: |
          mkdir -p dist
          cp *.html dist/

      - name: Apply pending D1 schema migrations
        id: d1_migrations
        continue-on-error: true
        run: npx --yes wrangler@4 d1 migrations apply daemon-ace-leads --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Report D1 migration status
        if: steps.d1_migrations.outcome == 'failure'
        run: |
          echo "::warning::D1 migration was not applied. The Worker will deploy, but D1-backed APIs remain unavailable until the database migrations succeed."
          echo "### DAEMON ACE D1 migration: ACTION REQUIRED" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Wrangler could not apply D1 migrations. The Cloudflare API token must include **D1: Edit** for the account containing database **daemon-ace-leads** (database ID `f7168786-e696-4694-896c-614626a2bbb3`). Keep the existing Worker deployment permissions." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Update the GitHub Actions secret `CLOUDFLARE_API_TOKEN` with a token that has D1: Edit, then rerun this workflow. Wrangler will apply all pending migrations in order from `migrations/`." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Until then, `/api/health` reports the missing D1 tables and baseline/recovery endpoints fail closed with HTTP 503." >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy Daemon Engineering Solutions
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Redirect legacy Daemon IT Consulting URL
        run: npx --yes wrangler@4 deploy --config wrangler-redirect.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
