name: DAEMON ACE Pre-Flight
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run DAEMON ACE local preflight
        shell: bash
        run: |
          set +e
          mkdir -p daemon-ace-output
          find . -type f \( -name '*.yaml' -o -name '*.yml' \) -not -path './.git/*' -print0 | while IFS= read -r -d '' file; do
            safe=$(printf '%s' "$file" | tr '/ ' '__')
            node ./bin/daemon-ace.mjs preflight "$file" --json > "daemon-ace-output/$safe.json"
          done
          echo "Preflight artifacts generated. Review findings; this workflow does not approve or deploy."
      - name: Upload DAEMON ACE receipts
        uses: actions/upload-artifact@v4
        with:
          name: daemon-ace-preflight-receipts
          path: daemon-ace-output/*.json
          if-no-files-found: warn
          retention-days: 14
