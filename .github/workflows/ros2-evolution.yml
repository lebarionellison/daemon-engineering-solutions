name: DAEMON ACE ROS 2 Evolution Matrix

on:
  pull_request:
    paths:
      - 'ros2/communication_assurance/**'
      - '.github/workflows/ros2-evolution.yml'
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daemon-ace-ros2-evolution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  messaging-smoke-test:
    name: ROS 2 ${{ matrix.distro }} messaging smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy, lyrical, rolling]
    container:
      image: ros:${{ matrix.distro }}-ros-base
    env:
      ROS_DOMAIN_ID: "42"
      ROS_LOCALHOST_ONLY: "1"
    steps:
      - name: Install distro-matched ROS 2 demo nodes and verify publisher/subscriber exchange
        shell: bash
        run: |
          set -euo pipefail
          echo "Testing ROS_DISTRO=${ROS_DISTRO}"
          test "${ROS_DISTRO}" = "${{ matrix.distro }}"
          apt-get update -qq
          apt-get install -y --no-install-recommends "ros-${ROS_DISTRO}-demo-nodes-cpp"
          set +u
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          set -u
          ros2 --help >/dev/null
          ros2 run demo_nodes_cpp talker > /tmp/ros2-talker.log 2>&1 &
          talker_pid=$!
          ros2 run demo_nodes_cpp listener > /tmp/ros2-listener.log 2>&1 &
          listener_pid=$!
          cleanup() {
            kill "$talker_pid" "$listener_pid" 2>/dev/null || true
            wait "$talker_pid" "$listener_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 15); do
            if grep -q "Publishing:" /tmp/ros2-talker.log && grep -q "I heard:" /tmp/ros2-listener.log; then
              break
            fi
            sleep 1
          done
          echo "--- TALKER ---"
          cat /tmp/ros2-talker.log
          echo "--- LISTENER ---"
          cat /tmp/ros2-listener.log
          grep -q "Publishing:" /tmp/ros2-talker.log
          grep -q "I heard:" /tmp/ros2-listener.log
          echo "PASS: ROS 2 publisher/subscriber messaging exchanged messages for ${ROS_DISTRO}."
      - name: Upload ROS 2 messaging logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ros2-messaging-${{ matrix.distro }}
          path: /tmp/ros2-*.log
          if-no-files-found: ignore
          retention-days: 14

  validate-release-metadata:
    name: Validate ROS 2 lifecycle metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate compatibility matrix and guard planned release status
        run: |
          python -m json.tool ros2/compatibility-matrix.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("ros2/compatibility-matrix.json").read_text())
          distros = {item["id"]: item for item in data["distributions"]}
          assert set(distros) == {"humble", "jazzy", "lyrical", "makoa", "rolling"}
          assert distros["makoa"]["daemon_ace_status"] == "planned-not-released"
          assert distros["lyrical"]["upstream_eol"] == "2031-05"
          assert distros["rolling"]["channel"] == "development"
          print("ROS 2 lifecycle metadata is valid; Makoa remains planned, not released.")
          PY

  communication-assurance:
    name: ROS 2 ${{ matrix.distro }} / ${{ matrix.rmw }} QoS assurance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy, lyrical, rolling]
        rmw: [rmw_fastrtps_cpp, rmw_cyclonedds_cpp]
    container:
      image: ros:${{ matrix.distro }}-ros-base
    env:
      ROS_DOMAIN_ID: "44"
      ROS_LOCALHOST_ONLY: "1"
      RMW_IMPLEMENTATION: ${{ matrix.rmw }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install RMW implementations and message package
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            "ros-${ROS_DISTRO}-rmw-fastrtps-cpp" \
            "ros-${ROS_DISTRO}-rmw-cyclonedds-cpp" \
            "ros-${ROS_DISTRO}-std-msgs"
      - name: Run live DDS QoS probes
        shell: bash
        run: |
          set -euo pipefail
          set +u
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          set -u
          test "${ROS_DISTRO}" = "${{ matrix.distro }}"
          test "${RMW_IMPLEMENTATION}" = "${{ matrix.rmw }}"
          mkdir -p communication-assurance-results
          python3 ros2/communication_assurance/qos_probe.py \
            --scenario all --duration 3 \
            --output "communication-assurance-results/${ROS_DISTRO}-${RMW_IMPLEMENTATION}.json"
      - name: Validate report contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path("communication-assurance-results") / f"{os.environ['ROS_DISTRO']}-{os.environ['RMW_IMPLEMENTATION']}.json"
          report = json.loads(path.read_text(encoding="utf-8"))
          expected = {
              "reliable_to_reliable", "reliable_to_best_effort",
              "best_effort_to_reliable", "transient_local_retention",
              "transient_local_to_volatile", "volatile_to_transient_local",
          }
          actual = {item["name"] for item in report["scenarios"]}
          assert report["schema"] == "daemon-ace.ros2-communication-assurance.v1"
          assert report["report_version"] == "1.0.0"
          assert actual == expected, f"Scenario mismatch: {actual}"
          assert report["summary"]["scenarios_passed"] == 6, report["summary"]
          assert report["summary"]["scenarios_failed"] == 0, report["summary"]
          assert report["summary"]["disposition"] == "PASS"
          assert report["environment"]["rmw_implementation"] == os.environ["RMW_IMPLEMENTATION"]
          print(f"PASS: {path} — six scenarios")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ros2-communication-${{ matrix.distro }}-${{ matrix.rmw }}
          path: communication-assurance-results/
          if-no-files-found: warn
          retention-days: 30
