name: DAEMON ACE Pre-Flight
on:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'examples/preflight/**'
      - 'daemon_ace_preflight.py'
      - 'daemon_reflex_guard.py'
      - 'examples/default-deny-egress-networkpolicy.yaml'
      - 'daemon_reflex_guard.py'
      - 'examples/default-deny-egress-networkpolicy.yaml'
      - 'examples/unsafe-ros2-robot.yaml'
      - 'worker.js'
      - 'index.html'
      - 'manifests/**'
      - 'k8s/**'
      - 'ros2/**'
      - '.github/workflows/ros2-evolution.yml'
      - '.github/workflows/daemon-preflight.yml'
  pull_request:
    paths:
      - 'bin/**'
      - 'examples/preflight/**'
      - 'daemon_ace_preflight.py'
      - 'daemon_reflex_guard.py'
      - 'examples/default-deny-egress-networkpolicy.yaml'
      - 'examples/unsafe-ros2-robot.yaml'
      - 'worker.js'
      - 'index.html'
      - 'manifests/**'
      - 'k8s/**'
      - 'ros2/**'
      - '.github/workflows/ros2-evolution.yml'
      - '.github/workflows/daemon-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daemon-engineering-solutions-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    name: Generate review receipts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run DAEMON ACE pre-flight checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p daemon-ace-output
          mapfile -d '' manifests < <(
            for root in examples/preflight manifests k8s; do
              if [ -d "$root" ]; then
                find "$root" -type f \( -name '*.yaml' -o -name '*.yml' \) -print0
              fi
            done | sort -z
          )
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "::error::No manifests found. Add a YAML file under examples/preflight/, manifests/, or k8s/."
            exit 1
          fi
          for file in "${manifests[@]}"; do
            safe=$(printf '%s' "$file" | tr '/ ' '__')
            receipt="daemon-ace-output/${safe}.json"
            echo "Reviewing $file"
            set +e
            node ./bin/daemon-ace.mjs preflight "$file" --json > "$receipt"
            status=$?
            set -e
            if [ "$status" -gt 1 ]; then
              echo "::error::DAEMON ACE could not process $file (exit $status)."
              exit "$status"
            fi
            node -e "const r=require('./$receipt'); if(r.schema!=='daemon-ace.receipt-of-safety.v1') process.exit(1); console.log('Receipt generated:', r.source_file, '| findings:', r.analysis.findings.length);"
            if [ "$status" -eq 1 ]; then
              echo "::warning::High-severity heuristic findings in $file. Review the receipt artifact; this workflow does not approve or deploy."
            fi
          done
          {
            echo "## DAEMON ACE Pre-Flight"
            echo ""
            echo "Generated a review receipt for ${#manifests[@]} manifest(s)."
            echo ""
            echo "**Important:** A green workflow means the pre-flight script completed and receipts were generated. It is not a security certification, deployment approval, or proof that a manifest is safe."
            echo "High-severity heuristic findings are surfaced as warnings for human review."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Python for ROS2 CLI fixture
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify unsafe ROS2 fixture is blocked by Python CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile daemon_ace_preflight.py
          set +e
          output=$(python3 daemon_ace_preflight.py examples/unsafe-ros2-robot.yaml 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 1 ]; then
            echo "::error::Expected the intentionally unsafe robotics fixture to return blocking exit code 1; got $status."
            exit 1
          fi
          for rule in SEC-001 SUP-004 ROB-006 ROB-007; do
            if ! grep -q "$rule" <<< "$output"; then
              echo "::error::Expected rule $rule was not detected."
              exit 1
            fi
          done
      - name: Verify Reflex Guard default-deny decisions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile daemon_reflex_guard.py
          set +e
          python3 daemon_reflex_guard.py --destination 203.0.113.77 --event unauthorized-egress > /tmp/reflex-guard.json
          status=$?
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("/tmp/reflex-guard.json").read_text())
          assert result["policy"] == "DEFAULT_DENY_EGRESS"
          assert result["egress_decisions"][0]["decision"] == "DENY"
          assert result["incident_response"]["containment"]["executed"] is False
          assert result["execution"]["cluster_mutated"] is False
          print("PASS: Reflex Guard denies an unlisted destination and does not mutate infrastructure.")
          PY
          test "$status" -eq 1

      - name: Upload pre-flight receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daemon-engineering-solutions-preflight-receipts
          path: daemon-ace-output/*.json
          if-no-files-found: error
          retention-days: 14

  ros2-messaging-smoke-test:
    name: ROS 2 ${{ matrix.distro }} messaging smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy, lyrical, rolling]
    container:
      image: ros:${{ matrix.distro }}-ros-base
    env:
      ROS_DOMAIN_ID: "42"
      ROS_LOCALHOST_ONLY: "1"
    steps:
      - name: Install distro-matched ROS 2 demo nodes and verify publisher/subscriber exchange
        shell: bash
        run: |
          set -euo pipefail
          echo "Testing ROS_DISTRO=${ROS_DISTRO}"
          test "${ROS_DISTRO}" = "${{ matrix.distro }}"
          apt-get update -qq
          apt-get install -y --no-install-recommends "ros-${ROS_DISTRO}-demo-nodes-cpp"
          set +u
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          set -u
          ros2 run demo_nodes_cpp talker > /tmp/ros2-talker.log 2>&1 &
          talker_pid=$!
          ros2 run demo_nodes_cpp listener > /tmp/ros2-listener.log 2>&1 &
          listener_pid=$!
          cleanup() {
            kill "$talker_pid" "$listener_pid" 2>/dev/null || true
            wait "$talker_pid" "$listener_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 15); do
            if grep -q "Publishing:" /tmp/ros2-talker.log && grep -q "I heard:" /tmp/ros2-listener.log; then
              break
            fi
            sleep 1
          done
          echo "--- TALKER ---"
          cat /tmp/ros2-talker.log
          echo "--- LISTENER ---"
          cat /tmp/ros2-listener.log
          grep -q "Publishing:" /tmp/ros2-talker.log
          grep -q "I heard:" /tmp/ros2-listener.log
          echo "PASS: ROS 2 publisher/subscriber messaging exchanged messages for ${ROS_DISTRO}."
      - name: Upload ROS 2 messaging logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ros2-messaging-${{ matrix.distro }}
          path: /tmp/ros2-*.log
          if-no-files-found: ignore
          retention-days: 14

  validate-ros2-release-metadata:
    name: Validate ROS 2 lifecycle metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate compatibility matrix and guard planned release status
        run: |
          python -m json.tool ros2/compatibility-matrix.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("ros2/compatibility-matrix.json").read_text())
          distros = {item["id"]: item for item in data["distributions"]}
          assert set(distros) == {"humble", "jazzy", "lyrical", "makoa", "rolling"}
          assert distros["makoa"]["daemon_ace_status"] == "planned-not-released"
          assert distros["lyrical"]["upstream_eol"] == "2031-05"
          assert distros["rolling"]["channel"] == "development"
          print("ROS 2 lifecycle metadata is valid; Makoa remains planned, not released.")
          PY
