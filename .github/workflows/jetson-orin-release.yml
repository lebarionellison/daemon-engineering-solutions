name: DAEMON ACE Jetson Orin ARM64 Build & Test
on:
  push:
    branches: [main]
    paths: ['jetson-orin/**', '.github/workflows/jetson-orin-release.yml']
  pull_request:
    paths: ['jetson-orin/**', '.github/workflows/jetson-orin-release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daemon-ace-jetson-orin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test-release:
    name: Native ARM64 package, ROS test and release
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install ROS 2 Jazzy on native ARM64 runner
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common curl gnupg python3-pytest dpkg-dev
          sudo add-apt-repository -y universe
          sudo curl -fsSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=arm64 signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu noble main" | sudo tee /etc/apt/sources.list.d/ros2.list
          sudo apt-get update
          sudo apt-get install -y ros-jazzy-ros-base
      - name: Run edge-agent unit tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          python3 -m pytest -q jetson-orin/test_edge_agent.py
      - name: Smoke-test ROS 2 agent startup on ARM64
        shell: bash
        run: |
          set +e
          output=$(timeout 8s bash -lc 'source /opt/ros/jazzy/setup.bash && python3 jetson-orin/edge_agent.py' 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [[ "$status" -ne 124 ]] || ! grep -q 'DAEMON_ACE_EDGE_READY topic=/daemon_ace/edge/heartbeat' <<< "$output"; then
            echo "::error::ROS 2 edge-agent startup smoke test failed."
            exit 1
          fi
      - name: Assemble ARM64 Debian package
        shell: bash
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/daemon-ace-edge"
          mkdir -p "$pkg/DEBIAN" "$pkg/opt/daemon-ace-edge" "$pkg/usr/local/bin" "$pkg/etc/systemd/system"
          cp jetson-orin/edge_agent.py "$pkg/opt/daemon-ace-edge/edge_agent.py"
          cp jetson-orin/start.sh "$pkg/usr/local/bin/daemon-ace-edge-start"
          cp jetson-orin/daemon-ace-edge.service "$pkg/etc/systemd/system/daemon-ace-edge.service"
          chmod 0755 "$pkg/usr/local/bin/daemon-ace-edge-start"
          cp jetson-orin/debian/control "$pkg/DEBIAN/control"
          cp jetson-orin/debian/postinst "$pkg/DEBIAN/postinst"
          cp jetson-orin/debian/prerm "$pkg/DEBIAN/prerm"
          chmod 0755 "$pkg/DEBIAN/postinst" "$pkg/DEBIAN/prerm"
          dpkg-deb --build --root-owner-group "$pkg" daemon-ace-edge_0.1.0_arm64.deb
          dpkg-deb --info daemon-ace-edge_0.1.0_arm64.deb
      - name: Verify package contents
        run: |
          dpkg-deb --contents daemon-ace-edge_0.1.0_arm64.deb
          dpkg-deb --extract daemon-ace-edge_0.1.0_arm64.deb "$RUNNER_TEMP/package-check"
          test -x "$RUNNER_TEMP/package-check/usr/local/bin/daemon-ace-edge-start"
          test -f "$RUNNER_TEMP/package-check/etc/systemd/system/daemon-ace-edge.service"
      - name: Assemble customer release bundle
        run: |
          mkdir -p release/daemon-ace-jetson-orin
          cp daemon-ace-edge_0.1.0_arm64.deb jetson-orin/deploy.sh jetson-orin/rollback.sh jetson-orin/README.md release/daemon-ace-jetson-orin/
          chmod +x release/daemon-ace-jetson-orin/deploy.sh release/daemon-ace-jetson-orin/rollback.sh
          tar -C release -czf daemon-ace-jetson-orin-release.tar.gz daemon-ace-jetson-orin
      - uses: actions/upload-artifact@v4
        with:
          name: daemon-ace-jetson-orin-arm64-release
          path: daemon-ace-jetson-orin-release.tar.gz
          if-no-files-found: error
          retention-days: 30
