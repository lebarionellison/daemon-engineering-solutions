services:
  daemon-ace-edge:
    image: daemon-ace-edge:jetson-orin
    container_name: daemon-ace-edge
    restart: unless-stopped
    runtime: nvidia
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '/opt/daemon_ace/edge_agent.py' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
